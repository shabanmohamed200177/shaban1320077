<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار المودال - الحل الجديد</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
    <div class="container py-4">
        <h3>اختبار المودال - الحل الجديد</h3>
        
        <!-- بطاقة تجريبية -->
        <div class="card shipment-card" data-id="123">
            <div class="card-body">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <div class="badge-status badge-secondary">تم تسليمها للمندوب</div>
                    <div class="tracking-number">رقم البوليصة TRACK-6899476F7D514</div>
                </div>
                <div class="info-section">
                    <div class="info-item">
                        <i class="fas fa-user info-icon"></i>
                        <span class="info-text">المستلم محمد ابراهيم</span>
                        <div class="contact-buttons">
                            <a class="btn btn-sm btn-contact" href="tel:010225998452"><i class="fas fa-phone"></i> اتصال</a>
                            <a class="btn btn-sm btn-contact" target="_blank" href="https://wa.me/010225998452"><i class="fab fa-whatsapp"></i></a>
                        </div>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-location-dot info-icon"></i>
                        <span class="info-text">دمياط</span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-sack-dollar info-icon"></i>
                        <span class="info-text">المطلوب تحصيله 2350</span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-coins info-icon"></i>
                        <span class="info-text">عمولة المندوب: 22 ج.م</span>
                    </div>
                </div>
                <div class="text-muted text-center mt-2" style="font-size:11px;">2025-08-11 04:29:19</div>
                <div class="shipment-actions mt-2 d-flex justify-content-center">
                    <button class="btn btn-sm btn-primary btn-show-detail">تفاصيل</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: تفاصيل الطلب -->
    <div class="modal fade detail-modal" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <div class="modal-header py-2">
                    <h6 class="modal-title" id="detailTitle">تفاصيل الطلب</h6>
                    <button type="button" class="close" data-dismiss="modal" aria-label="إغلاق"><span aria-hidden="true">&times;</span></button>
                </div>
                <div class="modal-body py-2" id="detailBody"></div>
                <div class="px-2 pb-2">
                    <div id="actionArea" class="modal-footer modal-footer-fixed d-flex w-100 action-area">
                        <button class="btn btn-success flex-fill" id="btnDelivered"><i class="fa fa-check"></i> تم التسليم</button>
                        <button class="btn btn-secondary flex-fill" data-toggle="modal" data-target="#partialModal"><i class="fa fa-check-double"></i> دفع جزئي</button>
                        <button class="btn btn-warning flex-fill" data-toggle="modal" data-target="#postponeModal"><i class="fa fa-clock"></i> تأجيل</button>
                        <button class="btn btn-danger flex-fill" data-toggle="modal" data-target="#rejectModal"><i class="fa fa-times"></i> رفض</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            // حفظ البيانات في الذاكرة
            window.shipmentsData = [
                {
                    id: 123,
                    tracking_number: 'TRACK-6899476F7D514',
                    recipient_name: 'محمد ابراهيم',
                    governorate_name: 'دمياط',
                    area_name: '',
                    total_to_collect: '2350',
                    cod_amount: '2350',
                    courier_commission_net: '22',
                    courier_commission: '22',
                    date_created: '2025-08-11 04:29:19',
                    status_name: 'تم تسليمها للمندوب',
                    status: '2',
                    recipient_phone: '010225998452'
                }
            ];
            
            console.log('Shipments data loaded:', window.shipmentsData);
            
            // فتح مودال التفاصيل
            $(document).on('click','.btn-show-detail', function(){
                var card = $(this).closest('.shipment-card');
                var currentParcelId = card.data('id');
                
                console.log('Button clicked for parcel ID:', currentParcelId);
                console.log('Available shipments data:', window.shipmentsData);
                
                // البحث عن البيانات الأصلية في الذاكرة
                var originalData = null;
                
                if (window.shipmentsData && window.shipmentsData.length > 0) {
                    originalData = window.shipmentsData.find(function(item) {
                        return item.id == currentParcelId;
                    });
                    console.log('Found original data:', originalData);
                }
                
                // عرض البيانات الأصلية
                if (originalData) {
                    displayModalData(originalData);
                } else {
                    console.log('No data found, using fallback');
                    displayModalDataFromCard(card);
                }
            });
            
            // دالة عرض البيانات في المودال
            function displayModalData(data) {
                console.log('Displaying data in modal:', data);
                
                // تنظيف وتأمين البيانات
                var trackingNumber = data.tracking_number || 'غير محدد';
                var recipientName = data.recipient_name || 'غير محدد';
                var location = (data.governorate_name || '') + (data.area_name ? ' - ' + data.area_name : '') || 'غير محدد';
                var amount = data.total_to_collect || data.cod_amount || '0';
                var commission = data.courier_commission_net || data.courier_commission || '0';
                var date = data.date_created || 'غير محدد';
                var status = data.status_name || data.status || 'غير محدد';
                var phone = data.recipient_phone || 'غير محدد';
                
                console.log('Processed data:', {
                    trackingNumber: trackingNumber,
                    recipientName: recipientName,
                    location: location,
                    amount: amount,
                    commission: commission,
                    date: date,
                    status: status,
                    phone: phone
                });
                
                var body = ''+
                    '<div class="row">'+
                        '<div class="col-md-6">'+
                            '<div class="mb-2"><strong>رقم التتبع:</strong> ' + trackingNumber + '</div>'+
                            '<div class="mb-2"><strong>المستلم:</strong> ' + recipientName + '</div>'+
                            '<div class="mb-2"><strong>العنوان:</strong> ' + location + '</div>'+
                            '<div class="mb-2"><strong>رقم الهاتف:</strong> ' + phone + '</div>'+
                        '</div>'+
                        '<div class="col-md-6">'+
                            '<div class="mb-2"><strong>المبلغ:</strong> ' + amount + ' ج.م</div>'+
                            '<div class="mb-2"><strong>الحالة:</strong> ' + status + '</div>'+
                            '<div class="mb-2"><strong>التاريخ:</strong> ' + date + '</div>'+
                            '<div class="mb-2"><strong>العمولة:</strong> ' + commission + ' ج.م</div>'+
                        '</div>'+
                    '</div>';
                
                console.log('HTML body:', body);
                
                $('#detailTitle').text('تفاصيل الطلب ' + trackingNumber);
                $('#detailBody').html(body);
                $('#detailModal').modal('show');
            }
            
            // دالة عرض البيانات من البطاقة (كبديل)
            function displayModalDataFromCard(card) {
                console.log('Using fallback data from card');
                
                var trackingNumber = card.find('.tracking-number').text().replace('رقم البوليصة ', '');
                var recipientName = card.find('.info-text').first().text().replace('المستلم ', '');
                var location = card.find('.info-text').eq(1).text();
                var amount = card.find('.info-text').eq(2).text().replace('المطلوب تحصيله ', '');
                var commission = card.find('.info-text').eq(3).text().replace('عمولة المندوب: ', '').replace(' ج.م', '');
                var date = card.find('.text-muted').last().text();
                var status = card.find('.badge-status').text();
                var phone = card.find('.btn-contact').first().attr('href') ? card.find('.btn-contact').first().attr('href').replace('tel:', '') : '';
                
                var body = ''+
                    '<div class="row">'+
                        '<div class="col-md-6">'+
                            '<div class="mb-2"><strong>رقم التتبع:</strong> ' + trackingNumber + '</div>'+
                            '<div class="mb-2"><strong>المستلم:</strong> ' + recipientName + '</div>'+
                            '<div class="mb-2"><strong>العنوان:</strong> ' + location + '</div>'+
                            '<div class="mb-2"><strong>رقم الهاتف:</strong> ' + phone + '</div>'+
                        '</div>'+
                        '<div class="col-md-6">'+
                            '<div class="mb-2"><strong>المبلغ:</strong> ' + amount + ' ج.م</div>'+
                            '<div class="mb-2"><strong>الحالة:</strong> ' + status + '</div>'+
                            '<div class="mb-2"><strong>التاريخ:</strong> ' + date + '</div>'+
                            '<div class="mb-2"><strong>العمولة:</strong> ' + commission + ' ج.م</div>'+
                        '</div>'+
                    '</div>';
                
                $('#detailTitle').text('تفاصيل الطلب ' + trackingNumber);
                $('#detailBody').html(body);
                $('#detailModal').modal('show');
            }
            
            console.log('Modal test script loaded successfully');
        });
    </script>
</body>
</html>
